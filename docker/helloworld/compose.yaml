services:
  # Each Sidecar owns both RingBuffers and runs telemetry in-process.
  sidecar-alpha:
    container_name: sidecar-alpha
    build:
      context: ../..
      dockerfile: workspace/infra/sidecar/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/ring-sidecar:0.1.0}
    ipc: shareable
    shm_size: ${ALPHA_SHM_SIZE:-64m}
    init: true
    environment:
      NODE_ID: Radar-Alpha
      RING_CAPACITY_BYTES: ${ALPHA_RING_CAPACITY_BYTES:-8388608}
      FORWARDER_MAX_TRANSFER_BYTES: ${FORWARDER_MAX_TRANSFER_BYTES:-262144}
      SIDECAR_UCX_ROLE: listen
      SIDECAR_UCX_BIND_HOST: 0.0.0.0
      SIDECAR_UCX_PORT: ${SIDECAR_UCX_PORT:-13337}
      SIDECAR_UCX_DATA_PATH: ${SIDECAR_UCX_DATA_PATH:-functional}
      UCX_TLS: ${UCX_TLS:-tcp,self}
      TELEMETRY_HOST: ${TELEMETRY_HOST:-telemetry-web}
      TELEMETRY_PORT: ${TELEMETRY_PORT:-9900}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-100}
    depends_on:
      - telemetry-web

  worker-alpha:
    container_name: worker-alpha
    build:
      context: ../..
      dockerfile: workspace/examples/signalsource/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${WORKER_IMAGE:-registry.chengyistudio.com/cxx/ring-worker:0.1.0}
    entrypoint: ["/app/signalsource"]
    ipc: service:sidecar-alpha
    init: true
    environment:
      WORKER_BLOCK_BYTES: ${WORKER_BLOCK_BYTES:-262144}
    depends_on:
      - sidecar-alpha

  sidecar-beta:
    container_name: sidecar-beta
    build:
      context: ../..
      dockerfile: workspace/infra/sidecar/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/ring-sidecar:0.1.0}
    ipc: shareable
    shm_size: ${BETA_SHM_SIZE:-64m}
    init: true
    environment:
      NODE_ID: Radar-Beta
      RING_CAPACITY_BYTES: ${BETA_RING_CAPACITY_BYTES:-8388608}
      FORWARDER_MAX_TRANSFER_BYTES: ${FORWARDER_MAX_TRANSFER_BYTES:-262144}
      SIDECAR_UCX_ROLE: connect
      SIDECAR_UCX_PEER_HOST: sidecar-alpha
      SIDECAR_UCX_PORT: ${SIDECAR_UCX_PORT:-13337}
      SIDECAR_UCX_DATA_PATH: ${SIDECAR_UCX_DATA_PATH:-functional}
      UCX_TLS: ${UCX_TLS:-tcp,self}
      TELEMETRY_HOST: ${TELEMETRY_HOST:-telemetry-web}
      TELEMETRY_PORT: ${TELEMETRY_PORT:-9900}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-100}
    depends_on:
      - telemetry-web
      - sidecar-alpha

  worker-beta:
    container_name: worker-beta
    build:
      context: ../..
      dockerfile: workspace/examples/algorithm/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${WORKER_IMAGE:-registry.chengyistudio.com/cxx/ring-worker:0.1.0}
    entrypoint: ["/app/algorithm"]
    volumes:
      - ./output:/output
    ipc: service:sidecar-beta
    init: true
    environment:
      WORKER_BLOCK_BYTES: ${WORKER_BLOCK_BYTES:-262144}
    depends_on:
      - sidecar-beta

  telemetry-web:
    container_name: telemetry-web
    build:
      context: ../..
      dockerfile: workspace/infra/web/Dockerfile
    image: ${TELEMETRY_IMAGE:-uestcradar-telemetry:0.1.0}
    ports:
      - "8081:8080"
      - "9900:9900/udp"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
