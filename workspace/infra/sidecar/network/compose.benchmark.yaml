services:
  server:
    build:
      context: ../../../..
      dockerfile: workspace/infra/sidecar/Dockerfile
      target: network-benchmark
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${UCX_BENCHMARK_IMAGE:-uestcradar-ucx-benchmark:0.1.0}
    command:
      - --server
      - --bind
      - 0.0.0.0
      - --port
      - "13337"
      - --quick
    environment:
      UCX_TLS: tcp,self
    init: true

  client:
    image: ${UCX_BENCHMARK_IMAGE:-uestcradar-ucx-benchmark:0.1.0}
    command:
      - --client
      - --host
      - server
      - --port
      - "13337"
      - --quick
    environment:
      UCX_TLS: tcp,self
    depends_on:
      - server
    init: true
