<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
<title id="title">Operator 节点数据路径</title>
<desc id="desc">上游 Sidecar 发送 Payload 到 Ingress，直接接收至 Input Ring，经 Worker 算法处理后写入 Output Ring，由 Egress 发送至下游。输入不绕过 Worker。旁路只读观测，两个 Leg 独立配置与恢复。</desc>
<defs>
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#203752}.title{font-size:23px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#5e7591}.mono{font-family:Consolas,monospace;font-size:11px;fill:#627b96}.section{font-size:13px;font-weight:700;fill:#45617f}.green{fill:#00856b}.blue{fill:#0878b6}.purple{fill:#742ee5}.orange{fill:#be5c1b}.plain{fill:white;stroke:#bed0e3}.rxbox{fill:#edfaf5;stroke:#52b696}.txbox{fill:#eef7ff;stroke:#65abdc}.controlbox{fill:#f7f3ff;stroke:#b896f2}.rx{fill:none;stroke:#00856b;stroke-width:1.8;marker-end:url(#g)}.tx{fill:none;stroke:#0878b6;stroke-width:1.8;marker-end:url(#b)}.ctl{fill:none;stroke:#742ee5;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#p)}.credit{fill:none;stroke:#0878b6;stroke-width:1.3;stroke-dasharray:3 3;marker-end:url(#b)}.observe{fill:none;stroke:#cc731c;stroke-width:1.5;stroke-dasharray:2 4;marker-end:url(#o)}
</style>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#00856b" d="M0 0 10 5 0 10Z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#0878b6" d="M0 0 10 5 0 10Z"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#742ee5" d="M0 0 10 5 0 10Z"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#cc731c" d="M0 0 10 5 0 10Z"/></marker>
</defs>
<rect width="1280" height="730" fill="white"/>
<text x="24" y="34" class="title">Operator 节点 / 数据路径</text>
<text x="24" y="56" class="small">输入必须经过 Worker 算法处理 · 单 Sidecar 进程，双 Leg 独立运行</text>
<text x="1256" y="32" text-anchor="end" class="small">目标设计 · Payload + control</text>
<path class="rx" d="M25 80H61"/><text x="70" y="84" class="small">输入 / 接收</text>
<path class="tx" d="M191 80H227"/><text x="236" y="84" class="small">输出 / 发送</text>
<path class="ctl" d="M361 80H397"/><text x="406" y="84" class="small">配置 / 生命周期</text>
<path class="observe" d="M570 80H606"/><text x="615" y="84" class="small">只读观测</text>
<line x1="24" x2="1256" y1="100" y2="100" stroke="#d8e3ee"/>
<rect x="194" y="121" width="886" height="556" rx="8" fill="#f8fafc" stroke="#9aafc9" stroke-width="1.2"/>
<text x="212" y="148" class="section">OPERATOR / 本地共享内存与算法</text>
<text x="1061" y="148" text-anchor="end" class="small">与远端 IP、RDMA、credit 解耦</text>
<!-- 处理阶段 -->
<rect x="220" y="205" width="190" height="96" rx="6" class="rxbox"/>
<text x="234" y="231" class="head">Worker Input Ring</text><text x="234" y="251" class="mono">registered SHM Slot</text><text x="234" y="273" class="small">Input&lt;Frame&gt; 读取视图</text><text x="234" y="290" class="small">校验类型 / 版本 / 长度</text>
<rect x="493" y="205" width="264" height="96" rx="6" class="plain"/>
<text x="508" y="231" class="head">Worker Algorithm</text><text x="508" y="251" class="mono">read → process → create / write</text><text x="508" y="273" class="small">只依赖 SDK · 直接访问 Slot</text><text x="508" y="290" class="small">输入释放与未提交输出取消</text>
<rect x="840" y="205" width="214" height="96" rx="6" class="txbox"/>
<text x="854" y="231" class="head">Worker Output Ring</text><text x="854" y="251" class="mono">registered SHM Slot</text><text x="854" y="273" class="small">Output&lt;Frame&gt; 提交输出</text><text x="854" y="290" class="small">可变 Payload，不超过配置上限</text>
<path class="rx" d="M410 250H493"/><text x="451" y="237" text-anchor="middle" class="small green">读取</text>
<path class="tx" d="M757 250H840"/><text x="799" y="237" text-anchor="middle" class="small blue">提交</text>
<!-- Ingress和Egress，不直接相连 -->
<rect x="220" y="398" width="190" height="104" rx="6" class="rxbox"/>
<text x="234" y="424" class="head">Ingress UCX Channel</text><text x="234" y="444" class="mono">Upstream Leg</text><text x="234" y="467" class="small">Payload 直接接收至 Input Slot</text><text x="234" y="487" class="small">获可写 Slot 后发放 credit</text>
<rect x="840" y="398" width="214" height="104" rx="6" class="txbox"/>
<text x="854" y="424" class="head">Egress UCX Channel</text><text x="854" y="444" class="mono">Downstream Leg</text><text x="854" y="467" class="small">持有下游 credit 后发送</text><text x="854" y="487" class="small">UCX 完成前保留 Slot lease</text>
<path class="rx" d="M315 398V301"/><text x="330" y="342" class="small green">zero-copy receive</text><text x="330" y="361" class="small">ucp_mem_map 注册页</text>
<path class="tx" d="M947 301V398"/><text x="932" y="342" text-anchor="end" class="small blue">zero-copy send</text><text x="932" y="361" text-anchor="end" class="small">禁止提前复用 Slot</text>
<!-- 远端 -->
<text x="24" y="374" class="section">上游节点</text>
<rect x="24" y="410" width="144" height="85" rx="6" class="plain"/>
<text x="37" y="436" class="head">Upstream</text><text x="37" y="457" class="head">Sidecar</text><text x="37" y="482" class="small">发送 Payload</text>
<path class="rx" d="M168 445H220"/><text x="194" y="432" text-anchor="middle" class="small green">RX</text>
<path class="credit" d="M220 480H168"/>
<text x="1110" y="374" class="section">下游节点</text>
<rect x="1110" y="410" width="146" height="85" rx="6" class="plain"/>
<text x="1123" y="436" class="head">Downstream</text><text x="1123" y="457" class="head">Sidecar</text><text x="1123" y="482" class="small">接收 Payload</text>
<path class="tx" d="M1054 445H1110"/><text x="1082" y="432" text-anchor="middle" class="small blue">TX</text>
<path class="credit" d="M1110 480H1054"/>
<!-- 局部只读观测 -->
<rect x="493" y="398" width="264" height="104" rx="6" fill="#fffaf1" stroke="#e4b571"/>
<text x="508" y="424" class="head">Telemetry / Sampler</text><text x="508" y="444" class="mono">bounded / lossy / non-blocking</text><text x="508" y="467" class="small">独立旁路 · 非 Payload 转发路径</text><text x="508" y="487" class="small">Link / Ring / credit / 预览 → Web</text>
<path class="observe" d="M410 461H493"/><path class="observe" d="M840 461H757"/>
<!-- 控制与恢复 -->
<rect x="220" y="556" width="397" height="95" rx="6" class="controlbox"/>
<text x="234" y="582" class="head">单向契约与 credit 流控</text><text x="234" y="604" class="small">传输前校验协议 / 类型 / schema / ABI / 端序 / 最大载荷</text><text x="234" y="625" class="small">credit ↔ Payload ↔ Slot lease 严格对应</text><text x="234" y="642" class="small">多 credit / 多请求窗口；不覆盖未消费数据</text>
<rect x="657" y="556" width="397" height="95" rx="6" class="controlbox"/>
<text x="671" y="582" class="head">独立配置与故障恢复</text><text x="671" y="604" class="small">listen / connect / disabled · 地址 / 超时 / 退避</text><text x="671" y="625" class="small">断线清理请求并重建；单侧故障不销毁另一侧或 SHM</text><text x="671" y="642" class="small">strict-RDMA 不满足条件时失败，不静默退化</text>
<path class="ctl" d="M315 556V502"/><text x="329" y="535" class="small purple">契约 / 状态</text>
<path class="ctl" d="M947 556V502"/><text x="961" y="535" class="small purple">契约 / 状态</text>
<text x="24" y="712" class="small">数据主路径：Upstream → Ingress → Input Ring → Worker → Output Ring → Egress → Downstream；只读观测不参与主链转发。</text>
</svg>
