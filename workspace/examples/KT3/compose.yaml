name: uestcradar-kt3

x-sidecar-common: &sidecar-common
  image: registry.chengyistudio.com/cxx/sidecar@sha256:d400a3b523fd1868b21d4a479552ef9de6bfec4ead6940dabae611a052f4f20c
  platform: linux/arm64
  network_mode: host
  ipc: shareable
  shm_size: 512m

x-sidecar-runtime: &sidecar-runtime
  UCX_TLS: tcp,self
  TELEMETRY_HOST: 127.0.0.1
  PREVIEW_HOST: 127.0.0.1

x-frontend-common: &frontend-common
  image: registry.chengyistudio.com/cxx/frontend@sha256:7784fe19bc47d1509705d347595d9e92254b59e2efb2c1b446bc63281ee28052
  platform: linux/arm64
  network_mode: host
  read_only: true

services:
  sidecar-source:
    <<: *sidecar-common
    environment:
      <<: *sidecar-runtime
      NODE_ID: local-iq-source
      TELEMETRY_PORT: "9902"
      PREVIEW_PORT: "9903"
      SIDECAR_UPSTREAM_ROLE: disabled
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: "24337"
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_source_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_source_down
      SIDECAR_UPSTREAM_SLOT_COUNT: "8"
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "4194304"
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "3"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: "8"
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: "4194304"
      SIDECAR_DOWNSTREAM_TYPE_ID: "1"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_qt5_source_down &&
          awk '$$3 ~ /:5F11$$/ && $$4 == "01" { connected=1 }
          END { exit !connected }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90
    depends_on:
      sidecar-pulsecompression:
        condition: service_healthy

  signalsource:
    image: registry.chengyistudio.com/cxx/worker@sha256:9a3faffdcbd186c3aa0c024770f58eba4e3a7c25556e2b5847c3e32e9abb319c
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-source
    environment:
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_source_down
    entrypoint: ["/app/signalsource"]
    command: ["--data-root", "/data", "--frames", "0"]
    depends_on:
      sidecar-source:
        condition: service_healthy

  sidecar-pulsecompression:
    <<: *sidecar-common
    environment:
      <<: *sidecar-runtime
      NODE_ID: local-pulsecompression
      TELEMETRY_PORT: "9904"
      PREVIEW_PORT: "9905"
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: "24337"
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: "24338"
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_pulsecompression_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_pulsecompression_down
      SIDECAR_UPSTREAM_SLOT_COUNT: "8"
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "4194304"
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "3"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: "8"
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: "1048576"
      SIDECAR_DOWNSTREAM_TYPE_ID: "2"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_qt5_pulsecompression_up &&
          test -e /dev/shm/uestcradar_qt5_pulsecompression_down &&
          awk '$$2 ~ /:5F11$$/ && ($$4 == "0A" || $$4 == "01")
          { listening=1 }
          $$3 ~ /:5F12$$/ && $$4 == "01" { connected=1 }
          END { exit !(listening && connected) }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90
    depends_on:
      sidecar-rd-bridge:
        condition: service_healthy

  pulsecompression:
    image: registry.chengyistudio.com/cxx/worker@sha256:24e4493e3e8e7cce3b5985b0394c943eee8663e1fd3049e422f718fa1aee8421
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-pulsecompression
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_pulsecompression_up
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_pulsecompression_down
    depends_on:
      sidecar-pulsecompression:
        condition: service_healthy

  sidecar-rd-bridge:
    <<: *sidecar-common
    environment:
      <<: *sidecar-runtime
      NODE_ID: local-qt5-rd-algorithm
      TELEMETRY_PORT: "9906"
      PREVIEW_PORT: "9907"
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: "24338"
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: "24339"
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_down
      SIDECAR_UPSTREAM_SLOT_COUNT: "8"
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "1048576"
      SIDECAR_UPSTREAM_TYPE_ID: "2"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: "4"
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: "33554432"
      SIDECAR_DOWNSTREAM_TYPE_ID: "3"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_qt5_algorithm_up &&
          test -e /dev/shm/uestcradar_qt5_algorithm_down &&
          awk '$$2 ~ /:5F12$$/ && ($$4 == "0A" || $$4 == "01")
          { listening=1 }
          $$3 ~ /:5F13$$/ && $$4 == "01" { connected=1 }
          END { exit !(listening && connected) }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90
    depends_on:
      sidecar-sink:
        condition: service_healthy

  sidecar-sink:
    <<: *sidecar-common
    environment:
      <<: *sidecar-runtime
      NODE_ID: local-rd-sink
      TELEMETRY_PORT: "9908"
      PREVIEW_PORT: "9909"
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: "24339"
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: disabled
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_sink_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_sink_down
      SIDECAR_UPSTREAM_SLOT_COUNT: "4"
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "33554432"
      SIDECAR_UPSTREAM_TYPE_ID: "3"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: "4"
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: "33554432"
      SIDECAR_DOWNSTREAM_TYPE_ID: "3"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_qt5_sink_up &&
          awk '$$2 ~ /:5F13$$/ && ($$4 == "0A" || $$4 == "01")
          { ready=1 } END { exit !ready }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90

  rd-algorithm:
    image: registry.chengyistudio.com/cxx/worker@sha256:0213dfc739c7ca3ca6f689e03ac02a2a2ad29f6ac74a85a5b38f77bf1d89e00a
    platform: linux/arm64
    init: true
    network_mode: host
    ipc: service:sidecar-rd-bridge
    environment:
      WORKER_FRAMES: "0"
      GFKD_TIMEOUT_MS: "600000"
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_up
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_down
    depends_on:
      sidecar-rd-bridge:
        condition: service_healthy

  frontend-source:
    <<: *frontend-common
    environment:
      NODE_ID: local-iq-source
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8081
      TELEMETRY_UDP_ADDR: 127.0.0.1:9902
      PREVIEW_TCP_ADDR: 127.0.0.1:9903

  frontend-pulsecompression:
    <<: *frontend-common
    environment:
      NODE_ID: local-pulsecompression
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8082
      TELEMETRY_UDP_ADDR: 127.0.0.1:9904
      PREVIEW_TCP_ADDR: 127.0.0.1:9905

  frontend-rd:
    <<: *frontend-common
    environment:
      NODE_ID: local-qt5-rd-algorithm
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8083
      TELEMETRY_UDP_ADDR: 127.0.0.1:9906
      PREVIEW_TCP_ADDR: 127.0.0.1:9907

  frontend-sink:
    <<: *frontend-common
    environment:
      NODE_ID: local-rd-sink
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8084
      TELEMETRY_UDP_ADDR: 127.0.0.1:9908
      PREVIEW_TCP_ADDR: 127.0.0.1:9909

  rd-sink:
    image: registry.chengyistudio.com/cxx/worker@sha256:9549a84a6853398de409237ac3b15f704d79364d1b11b35eab96fb3456b52948
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-sink
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_sink_up
    command: ["--frames", "0", "--log-every", "1"]
    depends_on:
      sidecar-sink:
        condition: service_healthy
