version: "2.4"

services:
  sidecar-source:
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/sidecar:latest}
    platform: linux/arm64
    network_mode: host
    ipc: shareable
    shm_size: ${SIDECAR_SHM_SIZE:-256m}
    environment:
      NODE_ID: example-iq-source
      SIDECAR_UPSTREAM_ROLE: disabled
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: ${EXAMPLE_AB_PORT:-24337}
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_example_iq_source_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_example_iq_source_down
      SIDECAR_UPSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_DOWNSTREAM_TYPE_ID: "1"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
      UCX_TLS: tcp,self
      TELEMETRY_HOST: 127.0.0.1

  iq-source:
    image: ${SIGNALSOURCE_IMAGE:-registry.chengyistudio.com/cxx/signalsource:latest}
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-source
    environment:
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_example_iq_source_down
    entrypoint: ["/app/signalsource"]
    command:
      - --type
      - iq
      - --rate-hz
      - ${RATE_HZ:-20}
      - --frames
      - ${SOURCE_FRAMES:-0}
    depends_on:
      - sidecar-source

  sidecar-algorithm:
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/sidecar:latest}
    platform: linux/arm64
    network_mode: host
    ipc: shareable
    shm_size: ${SIDECAR_SHM_SIZE:-256m}
    environment:
      NODE_ID: example-iq-to-pulse
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: ${EXAMPLE_AB_PORT:-24337}
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: ${EXAMPLE_BC_PORT:-24338}
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_example_algorithm_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_example_algorithm_down
      SIDECAR_UPSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_DOWNSTREAM_TYPE_ID: "2"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
      UCX_TLS: tcp,self
      TELEMETRY_HOST: 127.0.0.1

  algorithm:
    image: ${ALGORITHM_IMAGE:-registry.chengyistudio.com/cxx/algorithm-example:latest}
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-algorithm
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_example_algorithm_up
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_example_algorithm_down
    command:
      - --frames
      - ${OUTPUT_FRAMES:-0}
      - --log-every
      - ${LOG_EVERY:-20}
    depends_on:
      - sidecar-algorithm

  sidecar-sink:
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/sidecar:latest}
    platform: linux/arm64
    network_mode: host
    ipc: shareable
    shm_size: ${SIDECAR_SHM_SIZE:-256m}
    environment:
      NODE_ID: example-pulse-sink
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: ${EXAMPLE_BC_PORT:-24338}
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: disabled
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_example_pulse_sink_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_example_pulse_sink_down
      SIDECAR_UPSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_UPSTREAM_TYPE_ID: "2"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      SIDECAR_DOWNSTREAM_TYPE_ID: "2"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
      UCX_TLS: tcp,self
      TELEMETRY_HOST: 127.0.0.1

  pulse-sink:
    image: ${SIGNALSOURCE_IMAGE:-registry.chengyistudio.com/cxx/signalsource:latest}
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-sink
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_example_pulse_sink_up
    entrypoint: ["/app/frame-sink"]
    command:
      - --type
      - pulse
      - --frames
      - ${OUTPUT_FRAMES:-0}
      - --log-every
      - ${LOG_EVERY:-20}
      - --expect-range
      - "0"
    depends_on:
      - sidecar-sink
