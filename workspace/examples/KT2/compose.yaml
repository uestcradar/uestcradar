name: uestcradar-kt2

x-sidecar-common: &sidecar-common
  image: registry.chengyistudio.com/cxx/sidecar@sha256:d400a3b523fd1868b21d4a479552ef9de6bfec4ead6940dabae611a052f4f20c
  platform: linux/arm64
  network_mode: host
  ipc: shareable
  shm_size: 512m

x-sidecar-ring: &sidecar-ring
  SIDECAR_UPSTREAM_SLOT_COUNT: "4"
  SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "33554432"
  SIDECAR_DOWNSTREAM_SLOT_COUNT: "4"
  SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: "33554432"
  UCX_TLS: tcp,self
  TELEMETRY_HOST: 127.0.0.1
  PREVIEW_HOST: 127.0.0.1

x-frontend-common: &frontend-common
  image: registry.chengyistudio.com/cxx/frontend@sha256:7784fe19bc47d1509705d347595d9e92254b59e2efb2c1b446bc63281ee28052
  platform: linux/arm64
  network_mode: host
  read_only: true

services:
  sidecar-a:
    <<: *sidecar-common
    environment:
      <<: *sidecar-ring
      NODE_ID: local-source
      TELEMETRY_PORT: "9902"
      PREVIEW_PORT: "9903"
      SIDECAR_UPSTREAM_ROLE: disabled
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: "35337"
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_local_source_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_local_source_down
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "3"
      SIDECAR_DOWNSTREAM_TYPE_ID: "1"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_local_source_down &&
          awk '$$3 ~ /:8A09$$/ && $$4 == "01" { connected=1 }
          END { exit !connected }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90
    depends_on:
      sidecar-b:
        condition: service_healthy

  signalsource:
    image: registry.chengyistudio.com/cxx/worker@sha256:9a3faffdcbd186c3aa0c024770f58eba4e3a7c25556e2b5847c3e32e9abb319c
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-a
    environment:
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_local_source_down
    entrypoint: ["/app/signalsource"]
    command: ["--data-root", "/data", "--frames", "0"]
    depends_on:
      sidecar-a:
        condition: service_healthy

  sidecar-b:
    <<: *sidecar-common
    environment:
      <<: *sidecar-ring
      NODE_ID: local-pulsecompression
      TELEMETRY_PORT: "9904"
      PREVIEW_PORT: "9905"
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: "35337"
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: connect
      SIDECAR_DOWNSTREAM_PEER_HOST: 127.0.0.1
      SIDECAR_DOWNSTREAM_PORT: "35338"
      SIDECAR_DOWNSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_DOWNSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_local_pulsecompression_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_local_pulsecompression_down
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "3"
      SIDECAR_DOWNSTREAM_TYPE_ID: "2"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_local_pulsecompression_up &&
          test -e /dev/shm/uestcradar_local_pulsecompression_down &&
          awk '$$2 ~ /:8A09$$/ && ($$4 == "0A" || $$4 == "01")
          { listening=1 }
          $$3 ~ /:8A0A$$/ && $$4 == "01" { connected=1 }
          END { exit !(listening && connected) }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90
    depends_on:
      sidecar-c:
        condition: service_healthy

  pulsecompression:
    image: registry.chengyistudio.com/cxx/worker@sha256:24e4493e3e8e7cce3b5985b0394c943eee8663e1fd3049e422f718fa1aee8421
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-b
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_local_pulsecompression_up
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_local_pulsecompression_down
    command: ["--frames", "0", "--log-every", "10"]
    depends_on:
      sidecar-b:
        condition: service_healthy

  sidecar-c:
    <<: *sidecar-common
    environment:
      <<: *sidecar-ring
      NODE_ID: local-sink
      TELEMETRY_PORT: "9906"
      PREVIEW_PORT: "9907"
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 0.0.0.0
      SIDECAR_UPSTREAM_PORT: "35338"
      SIDECAR_UPSTREAM_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_DOWNSTREAM_ROLE: disabled
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_local_sink_up
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_local_sink_down
      SIDECAR_UPSTREAM_TYPE_ID: "2"
      SIDECAR_UPSTREAM_TYPE_VERSION: "2"
      SIDECAR_DOWNSTREAM_TYPE_ID: "2"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/uestcradar_local_sink_up &&
          awk '$$2 ~ /:8A0A$$/ && ($$4 == "0A" || $$4 == "01")
          { ready=1 } END { exit !ready }' /proc/net/tcp
      interval: 1s
      timeout: 1s
      retries: 90

  signalsink:
    image: registry.chengyistudio.com/cxx/worker@sha256:6977129d5efb1b313c54f6fc1938d4c99f5764fdd710ef2db28f3685b9ca6233
    platform: linux/arm64
    network_mode: host
    ipc: service:sidecar-c
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_local_sink_up
    command:
      - --frames
      - "0"
      - --log-every
      - "64"
      - --workers
      - "4"
      - --queue-depth
      - "8"
      - --target-range
      - "20480"
      - --target-half-width
      - "8"
      - --target-min-snr-db
      - "10"
      - --pulses-per-cpi
      - "64"
    depends_on:
      sidecar-c:
        condition: service_healthy

  frontend-source:
    <<: *frontend-common
    environment:
      NODE_ID: local-source
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8081
      TELEMETRY_UDP_ADDR: 127.0.0.1:9902
      PREVIEW_TCP_ADDR: 127.0.0.1:9903

  frontend-operator:
    <<: *frontend-common
    environment:
      NODE_ID: local-pulsecompression
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8082
      TELEMETRY_UDP_ADDR: 127.0.0.1:9904
      PREVIEW_TCP_ADDR: 127.0.0.1:9905

  frontend-sink:
    <<: *frontend-common
    environment:
      NODE_ID: local-sink
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8083
      TELEMETRY_UDP_ADDR: 127.0.0.1:9906
      PREVIEW_TCP_ADDR: 127.0.0.1:9907
