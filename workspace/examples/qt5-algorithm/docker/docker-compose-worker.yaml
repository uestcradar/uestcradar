# Developer-owned Worker build/run configuration.
name: uestcradar-qt5-rd-worker

services:
  rd-algorithm:
    image: uestcradar/rd-algorithm:dev
    platform: linux/arm64
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: true
      args:
        ALGO_BASE: ${ALGO_BASE:-registry.chengyistudio.com/cxx/algo-base:GFKD}
    network_mode: host
    ipc: container:uestcradar-qt5-rd-sidecar
    environment:
      WORKER_FRAMES: ${WORKER_FRAMES:-0}
      GFKD_TIMEOUT_MS: ${GFKD_TIMEOUT_MS:-600000}
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_up
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_qt5_algorithm_down
    volumes:
      - ../output:/app/output
