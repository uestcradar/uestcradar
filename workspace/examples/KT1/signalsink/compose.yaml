# Standalone sink unit; connect a compatible TCP Source separately.
# No Web, recording UI, source process or automatic recording is started here.
version: "2.4"
services:
  sidecar-node:
    image: registry.chengyistudio.com/cxx/sidecar@sha256:d400a3b523fd1868b21d4a479552ef9de6bfec4ead6940dabae611a052f4f20c
    platform: linux/arm64
    network_mode: host
    ipc: shareable
    shm_size: 512m
    environment:
      NODE_ID: local-signalsink
      UCX_TLS: tcp,self
      SIDECAR_UPSTREAM_ROLE: listen
      SIDECAR_UPSTREAM_BIND_HOST: 127.0.0.1
      SIDECAR_UPSTREAM_PORT: "36337"
      SIDECAR_UPSTREAM_DATA_PATH: functional
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_signalsink_upstream
      SIDECAR_UPSTREAM_SLOT_COUNT: "4"
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: "33554432"
      SIDECAR_UPSTREAM_TYPE_ID: ${SIGNALSINK_TYPE_ID:?set input type}
      SIDECAR_UPSTREAM_TYPE_VERSION: ${SIGNALSINK_TYPE_VERSION:?set input version}
      SIDECAR_DOWNSTREAM_ROLE: disabled
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_signalsink_disabled
      TELEMETRY_HOST: 127.0.0.1
      TELEMETRY_PORT: "9922"
      PREVIEW_HOST: 127.0.0.1
      PREVIEW_PORT: "9923"
    healthcheck:
      test: ["CMD-SHELL", "test -e /dev/shm/uestcradar_signalsink_upstream"]
      interval: 1s
      timeout: 1s
      retries: 90
  worker-node:
    image: ${SIGNALSINK_IMAGE:?set verified immutable SignalSink ARM64 image}
    platform: linux/arm64
    ipc: service:sidecar-node
    environment:
      SIGNALSINK_INPUT: ${SIGNALSINK_TYPE_ID}:${SIGNALSINK_TYPE_VERSION}
      SIGNALSINK_CAPTURE_ROOT: /captures
      SIGNALSINK_QUEUE_BYTES: ${SIGNALSINK_QUEUE_BYTES:-536870912}
      SIGNALSINK_MIN_FREE_BYTES: ${SIGNALSINK_MIN_FREE_BYTES:-1073741824}
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_signalsink_upstream
    volumes:
      - ${SIGNALSINK_HOST_CAPTURE_ROOT:?set existing writable absolute capture root}:/captures
    depends_on:
      sidecar-node:
        condition: service_healthy
  frontend-node:
    image: registry.chengyistudio.com/cxx/frontend@sha256:7784fe19bc47d1509705d347595d9e92254b59e2efb2c1b446bc63281ee28052
    platform: linux/arm64
    network_mode: host
    read_only: true
    environment:
      NODE_ID: local-signalsink
      TELEMETRY_HTTP_ADDR: 127.0.0.1:8091
      TELEMETRY_UDP_ADDR: 127.0.0.1:9922
      PREVIEW_TCP_ADDR: 127.0.0.1:9923
